name: Sharflow Watchdog Scheduler

on:
  schedule:
    # Runs daily at 13:00 UTC (morning US / afternoon EU)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manually triggering the run from GitHub Actions UI

jobs:
  run-watchdog:
    name: Run Website Watchdog Intelligence Cycle
    # Only the approved production branch may consume production service secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Execute Watchdog Scheduler
        env:
          APP_ENV: production
          EMAIL_DELIVERY_MODE: resend
          PLANS_ENFORCED: ${{ secrets.PLANS_ENFORCED }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OAUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.OAUTH_TOKEN_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BING_CLIENT_ID: ${{ secrets.BING_CLIENT_ID }}
          BING_CLIENT_SECRET: ${{ secrets.BING_CLIENT_SECRET }}
        run: node scripts/run-watchdog-scheduler.js
